<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="input-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="hidden-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="output-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />

  <!-- Title & Subtitle -->
  <text x="400" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Meerlaags Neuraal Netwerk (Deep Learning Architectuur)</text>
  <text x="400" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Input Layer ➔ Verborgen Lagen (Feature Extractie) ➔ Output Layer (Classificatie)</text>

  <!-- Synapse Lines -->
  <!-- From Input (x=150) to Hidden 1 (x=330) -->
  <g stroke="#475569" stroke-width="1.2" opacity="0.4">
    <!-- i1: 120 -->
    <line x1="150" y1="120" x2="330" y2="100" />
    <line x1="150" y1="120" x2="330" y2="160" />
    <line x1="150" y1="120" x2="330" y2="220" />
    <line x1="150" y1="120" x2="330" y2="280" />
    <!-- i2: 190 -->
    <line x1="150" y1="190" x2="330" y2="100" />
    <line x1="150" y1="190" x2="330" y2="160" />
    <line x1="150" y1="190" x2="330" y2="220" />
    <line x1="150" y1="190" x2="330" y2="280" />
    <!-- i3: 260 -->
    <line x1="150" y1="260" x2="330" y2="100" />
    <line x1="150" y1="260" x2="330" y2="160" />
    <line x1="150" y1="260" x2="330" y2="220" />
    <line x1="150" y1="260" x2="330" y2="280" />
    <!-- i4: 330 -->
    <line x1="150" y1="330" x2="330" y2="100" />
    <line x1="150" y1="330" x2="330" y2="160" />
    <line x1="150" y1="330" x2="330" y2="220" />
    <line x1="150" y1="330" x2="330" y2="280" />

    <!-- From Hidden 1 (x=330) to Hidden 2 (x=500) -->
    <line x1="330" y1="100" x2="500" y2="120" />
    <line x1="330" y1="100" x2="500" y2="180" />
    <line x1="330" y1="100" x2="500" y2="240" />
    <line x1="330" y1="100" x2="500" y2="300" />
    <line x1="330" y1="160" x2="500" y2="120" />
    <line x1="330" y1="160" x2="500" y2="180" />
    <line x1="330" y1="160" x2="500" y2="240" />
    <line x1="330" y1="160" x2="500" y2="300" />
    <line x1="330" y1="220" x2="500" y2="120" />
    <line x1="330" y1="220" x2="500" y2="180" />
    <line x1="330" y1="220" x2="500" y2="240" />
    <line x1="330" y1="220" x2="500" y2="300" />
    <line x1="330" y1="280" x2="500" y2="120" />
    <line x1="330" y1="280" x2="500" y2="180" />
    <line x1="330" y1="280" x2="500" y2="240" />
    <line x1="330" y1="280" x2="500" y2="300" />

    <!-- From Hidden 2 (x=500) to Output (x=660) -->
    <line x1="500" y1="120" x2="660" y2="170" />
    <line x1="500" y1="120" x2="660" y2="250" />
    <line x1="500" y1="180" x2="660" y2="170" />
    <line x1="500" y1="180" x2="660" y2="250" />
    <line x1="500" y1="240" x2="660" y2="170" />
    <line x1="500" y1="240" x2="660" y2="250" />
    <line x1="500" y1="300" x2="660" y2="170" />
    <line x1="500" y1="300" x2="660" y2="250" />
  </g>

  <!-- Input Nodes -->
  <g filter="url(#glow)">
    <circle cx="150" cy="120" r="18" fill="url(#input-node)" />
    <circle cx="150" cy="190" r="18" fill="url(#input-node)" />
    <circle cx="150" cy="260" r="18" fill="url(#input-node)" />
    <circle cx="150" cy="330" r="18" fill="url(#input-node)" />
  </g>
  <text x="150" y="125" font-family="system-ui" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">x₁</text>
  <text x="150" y="195" font-family="system-ui" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">x₂</text>
  <text x="150" y="265" font-family="system-ui" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">x₃</text>
  <text x="150" y="335" font-family="system-ui" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">x₄</text>
  <text x="150" y="375" font-family="system-ui" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">Invoerlaag</text>

  <!-- Hidden Layer 1 Nodes -->
  <g filter="url(#glow)">
    <circle cx="330" cy="100" r="18" fill="url(#hidden-node)" />
    <circle cx="330" cy="160" r="18" fill="url(#hidden-node)" />
    <circle cx="330" cy="220" r="18" fill="url(#hidden-node)" />
    <circle cx="330" cy="280" r="18" fill="url(#hidden-node)" />
  </g>
  <text x="330" y="105" font-family="system-ui" font-size="11" fill="#ffffff" text-anchor="middle">h₁</text>
  <text x="330" y="165" font-family="system-ui" font-size="11" fill="#ffffff" text-anchor="middle">h₂</text>
  <text x="330" y="225" font-family="system-ui" font-size="11" fill="#ffffff" text-anchor="middle">h₃</text>
  <text x="330" y="285" font-family="system-ui" font-size="11" fill="#ffffff" text-anchor="middle">h₄</text>
  <text x="330" y="375" font-family="system-ui" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle">Verborgen Laag 1</text>

  <!-- Hidden Layer 2 Nodes -->
  <g filter="url(#glow)">
    <circle cx="500" cy="120" r="18" fill="url(#hidden-node)" />
    <circle cx="500" cy="180" r="18" fill="url(#hidden-node)" />
    <circle cx="500" cy="240" r="18" fill="url(#hidden-node)" />
    <circle cx="500" cy="300" r="18" fill="url(#hidden-node)" />
  </g>
  <text x="500" y="125" font-family="system-ui" font-size="11" fill="#ffffff" text-anchor="middle">h₅</text>
  <text x="500" y="185" font-family="system-ui" font-size="11" fill="#ffffff" text-anchor="middle">h₆</text>
  <text x="500" y="245" font-family="system-ui" font-size="11" fill="#ffffff" text-anchor="middle">h₇</text>
  <text x="500" y="305" font-family="system-ui" font-size="11" fill="#ffffff" text-anchor="middle">h₈</text>
  <text x="500" y="375" font-family="system-ui" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle">Verborgen Laag 2</text>

  <!-- Output Layer Nodes -->
  <g filter="url(#glow)">
    <circle cx="660" cy="170" r="20" fill="url(#output-node)" />
    <circle cx="660" cy="250" r="20" fill="url(#output-node)" />
  </g>
  <text x="660" y="175" font-family="system-ui" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ŷ₁</text>
  <text x="660" y="255" font-family="system-ui" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ŷ₂</text>
  <text x="660" y="375" font-family="system-ui" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">Uitvoerlaag</text>
</svg>
