<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1d11"/>
      <stop offset="100%" stop-color="#191008"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Desert Sand Board -->
  <rect width="500" height="350" rx="12" fill="url(#bgGrad)" stroke="#8c6239" stroke-width="3"/>

  <!-- Title -->
  <text x="250" y="36" fill="#e8c89b" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">
    ZERO'S DESERT NAVIGATION DIAGRAM (CHAPTER 42)
  </text>
  <text x="250" y="56" fill="#bfa17c" font-family="sans-serif" font-size="12" font-style="italic" text-anchor="middle">
    Drawn in the dust to navigate from Mary Lou back to Camp Green Lake
  </text>

  <!-- Triangular Path Lines -->
  <!-- Camp Green Lake to Big Thumb -->
  <line x1="80" y1="260" x2="420" y2="120" stroke="#d4a373" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Camp Green Lake to Mary Lou -->
  <line x1="80" y1="260" x2="260" y2="230" stroke="#d4a373" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Mary Lou to Big Thumb -->
  <line x1="260" y1="230" x2="420" y2="120" stroke="#d4a373" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Return Path from Mary Lou to Camp (Highlighted) -->
  <path d="M 260 230 L 80 260" stroke="#ffcc00" stroke-width="3" filter="url(#glow)"/>
  <!-- Direction Arrow -->
  <polygon points="165,243 175,248 173,238" fill="#ffcc00"/>

  <!-- Landmark 1: Camp Green Lake -->
  <g transform="translate(80, 260)">
    <circle r="12" fill="#d9534f" stroke="#fff" stroke-width="2"/>
    <text x="0" y="4" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">C</text>
    <text x="0" y="28" fill="#f0ad4e" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Camp Green Lake</text>
    <text x="0" y="42" fill="#bbb" font-family="sans-serif" font-size="11" text-anchor="middle">(Tents &amp; Holes)</text>
  </g>

  <!-- Landmark 2: Mary Lou Boat -->
  <g transform="translate(260, 230)">
    <circle r="12" fill="#337ab7" stroke="#fff" stroke-width="2"/>
    <text x="0" y="4" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">B</text>
    <text x="0" y="-18" fill="#5bc0de" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Boat Mary Lou</text>
    <text x="0" y="-5" fill="#bbb" font-family="sans-serif" font-size="11" text-anchor="middle">(Sploosh Refuge)</text>
  </g>

  <!-- Landmark 3: God's Thumb -->
  <g transform="translate(420, 120)">
    <circle r="14" fill="#5cb85c" stroke="#fff" stroke-width="2"/>
    <text x="0" y="4" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">GT</text>
    <text x="0" y="-22" fill="#5cb85c" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">God's Thumb</text>
    <text x="0" y="-8" fill="#bbb" font-family="sans-serif" font-size="11" text-anchor="middle">(Onions &amp; Water Spring)</text>
  </g>

  <!-- Explanatory Caption -->
  <rect x="50" y="295" width="400" height="38" rx="6" fill="#22150b" stroke="#5c3e21" stroke-width="1"/>
  <text x="250" y="318" fill="#e0d0b8" font-family="sans-serif" font-size="11" text-anchor="middle">
    "That means we should have turned right when we left the boat." — Hector Zeroni
  </text>
</svg>
