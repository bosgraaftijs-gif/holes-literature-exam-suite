<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <radialGradient id="earth-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <radialGradient id="mars-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    <radialGradient id="jupiter-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
    <radialGradient id="saturn-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="900" height="420" rx="16" fill="#030712" stroke="#1f2937" stroke-width="2" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="50" r="1.5" />
    <circle cx="160" cy="80" r="1" />
    <circle cx="280" cy="30" r="1.5" />
    <circle cx="420" cy="70" r="2" />
    <circle cx="590" cy="40" r="1" />
    <circle cx="730" cy="65" r="1.8" />
    <circle cx="840" cy="35" r="1.2" />
    <circle cx="120" cy="360" r="1.5" />
    <circle cx="340" cy="380" r="1" />
    <circle cx="510" cy="350" r="2" />
    <circle cx="680" cy="370" r="1.2" />
    <circle cx="820" cy="340" r="1.6" />
  </g>

  <!-- Title -->
  <text x="450" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f9fafb" text-anchor="middle">Overzicht van het Zonnestelsel</text>
  <text x="450" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Van de Zon tot de Buitenplaneten en Asteroïdengordel</text>

  <!-- Sun -->
  <circle cx="20" cy="220" r="100" fill="url(#sun-glow)" />
  <text x="50" y="225" font-family="system-ui" font-size="14" font-weight="bold" fill="#ffffff">ZON</text>

  <!-- Orbits & Planets -->
  <!-- Mercurius -->
  <circle cx="170" cy="220" r="8" fill="#9ca3af" />
  <text x="170" y="248" font-family="system-ui" font-size="11" fill="#d1d5db" text-anchor="middle">Mercurius</text>

  <!-- Venus -->
  <circle cx="240" cy="220" r="14" fill="#fbbf24" />
  <text x="240" y="254" font-family="system-ui" font-size="11" fill="#d1d5db" text-anchor="middle">Venus</text>

  <!-- Aarde -->
  <circle cx="330" cy="220" r="16" fill="url(#earth-glow)" />
  <circle cx="350" cy="210" r="4" fill="#e5e7eb" /> <!-- Moon -->
  <text x="330" y="258" font-family="system-ui" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="middle">Aarde</text>

  <!-- Mars -->
  <circle cx="430" cy="220" r="12" fill="url(#mars-glow)" />
  <text x="430" y="254" font-family="system-ui" font-size="11" fill="#fca5a5" text-anchor="middle">Mars</text>

  <!-- Asteroid Belt hint -->
  <g fill="#6b7280" opacity="0.5">
    <circle cx="500" cy="180" r="2" />
    <circle cx="495" cy="210" r="1.5" />
    <circle cx="505" cy="235" r="2.5" />
    <circle cx="498" cy="260" r="2" />
    <text x="500" y="140" font-family="system-ui" font-size="10" fill="#9ca3af" text-anchor="middle">Asteroïdengordel</text>
  </g>

  <!-- Jupiter -->
  <circle cx="610" cy="220" r="38" fill="url(#jupiter-glow)" />
  <text x="610" y="280" font-family="system-ui" font-size="12" font-weight="bold" fill="#fed7aa" text-anchor="middle">Jupiter</text>

  <!-- Saturnus with Rings -->
  <g transform="translate(760, 220)">
    <ellipse cx="0" cy="0" rx="55" ry="14" fill="none" stroke="#ca8a04" stroke-width="6" opacity="0.7" transform="rotate(-18)" />
    <circle cx="0" cy="0" r="30" fill="url(#saturn-glow)" />
    <ellipse cx="0" cy="0" rx="55" ry="14" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.9" transform="rotate(-18)" />
  </g>
  <text x="760" y="280" font-family="system-ui" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">Saturnus</text>

  <!-- Scale footer note -->
  <text x="450" y="390" font-family="system-ui" font-size="11" fill="#6b7280" text-anchor="middle">*Afstanden en planeetgroottes zijn schematisch weergegeven voor didactische doeleinden.</text>
</svg>
